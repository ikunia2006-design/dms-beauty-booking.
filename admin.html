ound:transparent;color:var(--ink)}.btn.red{background:#fff0f1;color:#bd566a}.btn.wide{width:100%}.btn.sm{padding:9px 12px;border-radius:10px;font-size:12px}.btn.xs{padding:7px 10px;border-radius:9px;font-size:11px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:30px;padding:6px 9px;background:#f1e8f4;color:var(--plum);font-size:11px;font-weight:800}.badge.pending{background:#fff3e6;color:#a96f31}.badge.confirmed{background:#edf7f2;color:#32846c}.badge.done{background:#ebefff;color:#6577ba}.badge.cancelled{background:#fbecee;color:#bf6174}.badge.neutral{background:#f2f0f3;color:#77717f}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;object-fit:cover;border-radius:16px;border:1px solid #eadfea;background:#fff}.brandname{font-family:'Manrope',sans-serif;font-size:18px;letter-spacing:-.8px;font-weight:800}.brandname em{font-style:normal;color:var(--plum2)}.brandcaption{font-size:10px;color:var(--muted);letter-spacing:1.8px;text-transform:uppercase;font-family:Manrope,sans-serif}.field{display:flex;flex-direction:column;gap:8px}.field label{font-size:12px;font-weight:800;color:#5c4f64}.field input,.field select,.field textarea{width:100%;border:1px solid #e6dfe8;background:#fff;border-radius:13px;padding:13px 14px;color:var(--ink);min-height:45px;font-size:13px}.field textarea{resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#a77db2;outline:3px solid #f5e9f7}.stack{display:flex;flex-direction:column;gap:14px}.flex{display:flex}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{flex-wrap:wrap}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.grow{flex:1}.iconbtn{width:36px;height:36px;border:1px solid var(--line);border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--plum)}.divider{height:1px;background:var(--line);margin:14px 0}.pill{border card .statdesc{font-size:10px;color:#9a919d}.owner .twocol{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:18px}.owner .panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:23px;min-width:0}.owner .panel h2{font-size:15px}.owner .panel .panelcap{font-size:11px;color:var(--muted);margin-top:5px}.owner .appitem{padding:15px 0;border-bottom:1px solid #f2edf2;display:flex;align-items:center;gap:12px}.owner .appitem:last-child{border:0}.owner .apphour{border:1px solid #ebe3ed;background:#fcf9fd;color:#795a81;border-radius:10px;padding:10px 8px;font-size:11px;font-weight:800;min-width:65px;text-align:center}.owner .apptitle{font-size:12px;font-weight:800}.owner .appsub{font-size:10px;color:var(--muted);line-height:1.8;margin-top:3px}.owner .progressbar{height:8px;background:#f1ebf2;border-radius:999px;overflow:hidden}.owner .progressbar span{height:100%;display:block;background:var(--plum);border-radius:99px}.owner .barrows{display:flex;align-items:center;gap:10px;margin-top:17px;font-size:11px}.owner .barrows span{min-width:80px}.owner .barrows .progressbar{flex:1}.owner .table-scroll{overflow:auto;width:100%;border-radius:14px;border:1px solid var(--line)}.owner table{width:100%;border-collapse:collapse;min-width:760px;background:#fff}.owner th{font-size:10px;color:#948798;text-transform:uppercase;letter-spacing:.6px;background:#fcf9fc;text-align:left;padding:15px}.owner td{padding:14px 15px;border-top:1px solid #f0ebef;font-size:11px}.owner td strong{font-size:12px}.owner .toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:17px 0}.owner .toolbar select,.owner .toolbar input{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-size:11px;color:var(--ink)}.owner .toolbar input{min-width:180px;flex:1}.owner .toolbar input[type=date]{flex:0;min-width:auto}.owner .service-list{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.owner .managecard{background:#fff;border:1px solid var(--line);padding:17px;border-radius:16px;display:flex;align-items:center;gap:14px}.owner .managecard .manageico{width:48px;height:48px;background:#f8eff6;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:0 0 auto}.owner .managecard b{font-size:12px}.owner .managecard p{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.5}.owner .branch-list{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.owner .branchpanel{border-radius:17px;padding:21px;background:#fff;border:1px solid var(--line)}.owner .branchpanel h3{font-size:15px;margin-bottom:6px}.owner .branchpanel p{font-size:11px;color:var(--muted);line-height:1.9}.owner .branchpanel .num{font-family:Manrope,sans-serif;font-size:25px;font-weight:800;color:var(--plum)}.owner .ownerbottom{display:none}.owner .apptactions{display:flex;gap:5px;align-items:center}.owner .apptactions .btn{white-space:nowrap}

function dateFull(str){if(!str)return'—';const [y,m,d]=str.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('ka-GE',{weekday:'long',day:'numeric',month:'long'})}
function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function byId(list,id){return list.find(x=>x.id===id)}
function catName(id){return byId(CATS,id)?.name||id}
function catIcon(id){return byId(CATS,id)?.icon||'✨'}
let db;
function readDB(){try{let o=JSON.parse(localStorage.getItem(DBKEY));if(o?.version===4&&Array.isArray(o.bookings))return o}catch(err){console.warn('Local demo storage unavailable',err)}return initialDB()}
function saveDB(next){
 db=next;
 if(SERVER_MODE){
  const snapshot=JSON.parse(JSON.stringify(db));const revision=serverRevision;
  if(syncing){toast('დაელოდე ცვლილების შენახვას');return}
  syncing=true;
  fetch('/api/admin/state',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision,state:snapshot})})
  .then(async r=>{const data=await r.json();if(!r.ok)throw Error(data.detail||'შენახვა ვერ მოხერხდა');serverRevision=data.revision;})
  .catch(err=>{alert('ცვლილება ვერ შეინახა სერვერზე: '+err.message+'\nგანვაახლებ მონაცემებს.');loadServerState(true);})
  .finally(()=>{syncing=false;});
  return;
 }
 try{localStorage.setItem(DBKEY,JSON.stringify(db))}catch(err){console.warn('Demo save failed',err);toast('მონაცემების შენახვა ამ ბრაუზერში შეზღუდულია')}
 try{channel?.postMessage('update')}catch(err){}
}
let channel=null;try{channel=new BroadcastChannel('dms_apps_channel');channel.onmessage=()=>refreshFromOther()}catch(err){}
window.addEventListener('storage',ev=>{if(ev.key===DBKEY)refreshFromOther()});
function refreshFromOther(){db=readDB();if(typeof render==='function')render()}
function service(id){return byId(db.services,id)}
function branch(id){return byId(db.branches,id)}
function worker(id){return byId(db.staff,id)}
function eligible(branchId,category){return db.staff.filter(s=>s.active&&s.branch===branchId&&s.skills.includes(category))}
function minutes(t){const [h,m]=t.split(':').map(Number);return h*60+m}
function fmtMinute(min){return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`}
function busy(sid,date,start,duration,excludeId=''){return db.bookings.some(b=>b.id!==excludeId&&b.staffId===sid&&b.date===date&&b.status!=='cancelled'&&b.status!=='done'&&(()=>{let s=service(b.serviceId);let a=minutes(b.time),z=a+(s?.duration||60);return start<z&&start+duration>a})())}
function availableStaff(branchId,category,date,time,duration){let now=new Date();if(date<today())return[];if(date===today()&&minutes(time)<=now.getHours()*60+now.getMinutes()+15)return[];if(minutes(time)+duration>20*60)return[];return eligible(branchId,category).filter(w=>!busy(w.id,date,minutes(time),duration))}
function hasSlot(branchId,serviceId,staffId,date,time){let s=service(serviceId);if(!s||!s.active)return false;let a=availableStaff(branchId,s.category,date,time,s.duration);return staffId==='any'?a.length>0:a.some(x=>x.id===staffId)}
function bookingTimes(branchId,serviceId,staffId,date){const s=service(serviceId);if(!s)return[];let ans=[];for(let t=10*60;t+s.duration<=20*60;t+=30){const tt=fmtMinute(t);if(hasSlot(branchId,serviceId,staffId,date,tt))ans.push(tt)}return ans}
function timesOf(days=13){return Array.from({length:days+1},(_,i)=>{let d=new Date();d.setDate(d.getDate()+i);return ymd(d)})}
function prettyPrice(n){return `${Number(n||0).toLocaleString('ka-GE')} ₾`}
function stateTag(s){return `<span class="badge ${e(s)}"><span class="dot"></span>${STATUS[s]||s}</span>`}
let toastTimer;function toast(message){let node=document.querySelector('.toast');if(!node)return;node.textContent=message;node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),3000)}
function pageShell(content){document.getElementById('app').innerHTML=content+'<div class="toast" role="status" aria-live="polite"></div>'}
function appLoading(title='იტვირთება...'){document.getElementById('app').innerHTML=`<main class="app-gate"><div class="gate-icon">✦</div><h1>DMS Beauty Center</h1><p>${e(title)}</p></main>`}
function loginScreen(message=''){document.body.className='owner';document.getElementById('app').innerHTML=`<main class="app-gate"><img src="/assets/logo.jpg" alt="DMS" style="height:87px;width:87px;object-fit:cover;border-radius:50%;margin-bottom:18px"><div class="eyebrow">SECURE ADMIN</div><h1>DMS Admin</h1><p>ადმინისტრატორის პირადი შესვლა</p><form id="serverLogin" class="stack" style="max-width:350px;width:100%;margin:20px auto"><div class="field"><label>პაროლი</label><input type="password" name="password" autocomplete="current-password" placeholder="ადმინისტრატორის პაროლი" required></div><button class="btn wide">შესვლა →</button></form><p style="color:#bb5f6f">${e(message)}</p><small>ეს გვერდი მხოლოდ სალონის უფლებამოსილი პირებისთვისაა</small></main>`}
function offlineScreen(err){document.getElementById('app').innerHTML=`<main class="app-gate"><div class="gate-icon">!</div><h1>სერვერთან კავშირი ვერ დამყარდა</h1><p>${e(err)}</p><button class="btn" onclick="location.reload()">ხელახლა ცდა</button><p class="muted tiny">ეს ვებვერსია მონაცემებს სერვერიდან იღებს. თუ ფაილი პირდაპირ იხსნება, გამოიყენე HTML დემო.</p></main>`}
async function requestJSON(url,opts={}){let response=await fetch(url,{credentials:'same-origin',...opts});let data;try{data=await response.json()}catch{data={detail:'სერვერის პასუხი ვერ დამუშავდა'}}if(!response.ok)throw Object.assign(Error(data.detail||'სერვერის შეცდომა'),{status:response.status});return data}
async function loadServerState(force=false){
 if(!SERVER_MODE)return;
 if(serverLoadBusy||syncing)return;
 if(!force&&(document.activeElement?.closest('form')||document.getElementById('modalhost')))return;
 serverLoadBusy=true;
 try{
  let response=await requestJSON(window.DMS_KIND==='owner'?'/api/admin/state':'/api/public');
  let newdb=window.DMS_KIND==='owner'?response.state:response;
  const oldcount=db?.bookings?.filter(b=>b.status==='pending').length||0;
  serverRevision=response.revision;db=newdb;
  if(typeof render==='function')render();
  if(window.DMS_KIND==='owner' && oldcount && newdb.bookings.filter(b=>b.status==='pending').length>oldcount)toast('ახალი ჯავშანი მიღებულია ✨');
 }catch(err){
   if(window.DMS_KIND==='owner'&&err.status===401){loginScreen();}
   else if(!db||force){offlineScreen(err.message)}
 }finally{serverLoadBusy=false;}
}
function initialize(){
 if(SERVER_MODE){appLoading('ჯავშნები იტვირთება...');loadServerState(true);setInterval(()=>loadServerState(),7000);}
 else{db=readDB();render()}
}

function dashboard(){let list=db.bookings.filter(b=>b.date===today()&&b.status!=='cancelled'),pending=db.bookings.filter(b=>b.status==='pending').length,done=list.filter(b=>b.status==='done'),potential=list.filter(b=>['confirmed','pending'].includes(b.status)),income=done.reduce((acc,b)=>acc+(service(b.serviceId)?.price||0),0),forecast=potential.reduce((acc,b)=>acc+(service(b.serviceId)?.price||0),0);let perBranch=db.branches.map(b=>({b,count:list.filter(x=>x.branchId===b.id).length}));let max=Math.max(1,...perBranch.map(x=>x.count));return `<div class="between wrap" style="margin-bottom:17px"><div><div class="eyebrow">OVERVIEW</div><p class="section-desc">დღევანდელი სურათი · ${dateFull(today())}</p></div><span class="badge">დღეს · ${dateDisplay(today())}</span></div><div class="statgrid"><div class="statcard"><div class="statrow"><span>დღევანდელი ვიზიტები</span><span class="staticon">▦</span></div><div class="number">${list.length}</div><div class="statdesc">აქტიური და დასრულებული ჯავშნები</div></div><div class="statcard"><div class="statrow"><span>დადასტურებას ელოდება</span><span class="staticon">◷</span></div><div class="number">${pending}</div><div class="statdesc">ყველა ფილიალში, ყველა თარიღზე</div></div><div class="statcard"><div class="statrow"><span>შესრულებული · დღეს</span><span class="staticon">✓</span></div><div class="number">${prettyPrice(income)}</div><div class="statdesc">დემოს მიერ დათვლილი თანხა</div></div><div class="statcard"><div class="statrow"><span>დღის პოტენციური შემოსავალი</span><span class="staticon">↗</span></div><div class="number">${prettyPrice(forecast)}</div><div class="statdesc">დადასტურებული + მოსალოდნელი</div></div></div><div class="twocol"><section class="panel"><div class="between"><div><h2>დღევანდელი განრიგი</h2><p class="panelcap">ყველა ფილიალი · ჯავშნების მოკლე სია</p></div><button class="btn sm soft" data-act="nav" data-id="bookings">ყველა →</button></div><div style="margin-top:13px">${list.sort((a,b)=>a.time.localeCompare(b.time)).map(b=>`<div class="appitem"><span class="apphour">${e(b.time)}</span><div class="grow"><div class="apptitle">${e(b.name)}</div><div class="appsub">${e(service(b.serviceId)?.name||'სერვისი წაშლილია')} · ${e(branch(b.branchId)?.name||'—')}</div></div>${stateTag(b.status)}</div>`).join('')||'<div class="empty" style="margin-top:15px;padding:25px"><p>დღეს აქტიური ვიზიტები ჯერ არ არის.</p></div>'}</div></section><section class="panel"><div><h2>ვიზიტები ფილიალების მიხედვით</h2><p class="panelcap">დღევანდელი დატვირთვის მიმოხილვა</p></div><div style="margin-top:23px">${perBranch.map(({b,count})=>`<div class="barrows"><span>${e(b.name)}</span><div class="progressbar"><span style="width:${count/max*100}%"></span></div><b>${count}</b></div>`).join('')}</div><div class="divider" style="margin:28px 0 18px"></div><div class="between"><div><h2>სწრაფი მოქმედებები</h2><p class="panelcap">ყოველდღიური მართვა</p></div></div><div class="stack" style="margin-top:14px;gap:8px"><button class="btn outline wide" data-act="nav" data-id="bookings">◷ მოლოდინში მყოფი ჯავშნები</button><button class="btn outline wide" data-act="nav" data-id="services">✎ ტარიფებისა და სერვისების რედაქტირება</button></div></section></div><div class="notice" style="margin-top:18px">ყველა სტატისტიკა დათვლილია საცდელი ვიზიტებით და არ წარმოადგენს DMS Beauty Center-ის ნამდვილ შემოსავალს ან რეალურ კლიენტებს.</div>`}
function filteredBookings(){return db.bookings.filter(b=>(filterBranch==='all'||b.branchId===filterBranch)&&(filterStatus==='all'||b.status===filterStatus)&&(!filterDate||b.date===filterDate)&&(!filterSearch||`${b.name} ${b.phone} ${b.id} ${service(b.serviceId)?.name||''}`.toLowerCase().includes(filterSearch.toLowerCase()))).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))}
function bookingsPage(){let records=filteredBookings();return `<div class="between wrap"><div><div class="eyebrow">APPOINTMENTS</div><p class="section-desc">ჯავშნების დადასტურება, დასრულება და გაუქმება.</p></div><span class="badge">ნაპოვნია ${records.length}</span></div><div class="toolbar"><select id="filterBranch" aria-label="ფილიალი"><option value="all">ყველა ფილიალი</option>${db.branches.map(b=>`<option value="${b.id}" ${filterBranch===b.id?'selected':''}>${e(b.name)}</option>`).join('')}</select><select id="filterStatus" aria-label="სტატუსი"><option value="all">ყველა სტატუსი</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${filterStatus===k?'selected':''}>${v}</option>`).join('')}</select><input id="filterDate" type="date" aria-label="თარიღი" value="${e(filterDate)}"><input id="filterSearch" aria-label="ძებნა" placeholder="ძებნა: სახელი, ტელეფონი..." value="${e(filterSearch)}"><button class="btn sm outline" data-act="clearfilters">გასუფთავება</button></div><div class="table-scroll"><table><thead><tr><th>კლიენტი</th><th>მომსახურება / ოსტატი</th><th>ფილიალი</th><th>თარიღი / დრო</th><th>სტატუსი</th><th>ქმედება</th></tr></thead><tbody>${records.map(b=>`<tr><td><strong>${e(b.name)}</strong><div class="muted tiny" style="margin-top:5px">${e(b.phone||'ჯავშნის ჩანაწერი')}</div></td><td><strong>${e(service(b.serviceId)?.name||'სერვისი წაშლილია')}</strong><div class="muted tiny" style="margin-top:5px">${e(worker(b.staffId)?.name||'—')} · ${prettyPrice(service(b.serviceId)?.price)}</div></td><td>${e(branch(b.branchId)?.name||'—')}</td><td><b>${dateDisplay(b.date)}</b><div class="muted tiny" style="margin-top:5px">${e(b.time)}</div></td><td>${stateTag(b.status)}</td><td><div class="apptactions">${b.status==='pending'?`<button class="btn xs" data-act="status" data-id="${e(b.id)}" data-status="confirmed">✓</button>`:''}${b.status==='confirmed'?`<button class="btn xs soft" data-act="status" data-id="${e(b.id)}" data-status="done">შესრულდა</button>`:''}${!['cancelled','done'].includes(b.status)?`<button class="btn xs red" data-act="status" data-id="${e(b.id)}" data-status="cancelled">✕</button>`:''}<button class="btn xs outline" data-act="details" data-id="${e(b.id)}">ნახვა</button></div></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;padding:35px;color:#9a8e9e">ამ ფილტრით ჩანაწერები ვერ მოიძებნა.</td></tr>'}</tbody></table></div>`}
function servicesPage(){return `<div class="between wrap" style="margin-bottom:19px"><div><div class="eyebrow">MENU & PRICING</div><p class="section-desc">დაამატე და შეცვალე სახელწოდება, ფასი, ხანგრძლივობა.</p></div><button class="btn sm" data-act="editservice" data-id="new">+ ახალი მომსახურება</button></div><div class="notice" style="margin-bottom:17px">ყველა მითითებული ფასი საცდელია. ოფიციალურ ტარიფებთან გადამოწმების შემდეგ შეცვალე ისინი აქ.</div><div class="service-list">${db.services.map(s=>`<div class="managecard"><span class="manageico">${catIcon(s.category)}</span><div class="grow"><b>${e(s.name)}</b><p>${e(catName(s.category))} · ${s.duration} წთ · ${prettyPrice(s.price)} ${s.active?'':'· გამორთული'}</p></div><button class="btn xs outline" data-act="editservice" data-id="${e(s.id)}">რედაქტ.</button></div>`).join('')}</div>`}
function teamPage(){return `<div class="between wrap" style="margin-bottom:19px"><div><div class="eyebrow">TEAM</div><p class="section-desc">სპეციალისტების ფილიალები და კატეგორიები. სახელები დემოში პირობითია.</p></div><button class="btn sm" data-act="editstaff" data-id="new">+ სპეციალისტი</button></div><div class="service-list">${db.staff.map(s=>`<div class="managecard"><span class="manageico" style="font-size:17px">${e(s.name.slice(-2))}</span><div class="grow"><b>${e(s.name)}</b><p>${e(branch(s.branch)?.name||'—')} · ${s.skills.map(catName).join(', ')} ${s.active?'':'· არააქტიური'}</p></div><button class="btn xs outline" data-act="editstaff" data-id="${e(s.id)}">რედაქტ.</button></div>`).join('')}</div>`}
function branchesPage(){return `<div style="margin-bottom:19px"><div class="eyebrow">BRANCHES</div><p class="section-desc">DMS Beauty Center-ის ოთხი საჯაროდ მითითებული ფილიალი.</p></div><div class="branch-list">${db.branches.map(b=>{let staff=db.staff.filter(s=>s.branch===b.id&&s.active).length,appointments=db.bookings.filter(x=>x.branchId===b.id&&x.status!=='cancelled').length;return `<article class="branchpanel"><div class="between"><div><span class="eyebrow">DMS • TBILISI</span><h3 style="margin-top:8px">${e(b.name)} ფილიალი</h3></div><span style="font-size:29px;color:var(--plum)">⌖</span></div><p>${e(b.address)}</p><div class="divider"></div><div class="between"><div><span class="num">${staff}</span><p>აქტიური სპეციალისტი (დემო)</p></div><div><span class="num">${appointments}</span><p>სატესტო ჯავშანი</p></div></div></article>`}).join('')}</div>`}
function settingsPage(){if(SERVER_MODE)return `<div class="eyebrow">ACCOUNT & SECURITY</div><div class="panel" style="padding:25px;max-width:650px"><h2>ადმინისტრატორის უსაფრთხო პანელი</h2><p class="section-desc">ჯავშნები ინახება საერთო მონაცემთა ბაზაში. იმპორტი და დემოს განულება ონლაინ რეჟიმში გამორთულია.</p><button class="btn red" data-act="logout">გამოსვლა</button></div>`;return `<div class="eyebrow">SETTINGS</div><p class="section-desc" style="margin-bottom:22px">მონაცემთა ექსპორტი, იმპორტი და დემოს განულება.</p><section class="panel" style="max-width:720px"><h2>სატესტო მონაცემების მართვა</h2><p class="section-desc">ეს ფუნქციები გეხმარება საცდელი ჯავშნების გადატანაში, თუ ორი HTML ფაილი სხვადასხვა საცავში იხსნება.</p><div class="flex wrap gap8" style="margin-top:22px"><button class="btn sm" data-act="export">↓ JSON ექსპორტი</button><button class="btn sm outline" data-act="import">↑ JSON იმპორტი</button><button class="btn sm red" data-act="reset">↺ განულება</button><input id="importfile" type="file" accept=".json,application/json" hidden></div><div class="divider"></div><h2>რა აკლია რეალურ პროდუქტს?</h2><p class="section-desc">ანგარიშით შესვლა და როლები, დაცული სერვერული მონაცემთა ბაზა, რეალური შეტყობინებები, გადახდები, SMS-შეხსენებები, პერსონალური მონაცემების დაცვა და რეალური ფილიალების/სპეციალისტების განრიგები.</p></section>`}
function render(){document.title='DMS Admin • მართვის პანელი';document.body.className='owner';pageShell(`${sidebar()}<div class="ownerpage">${header()}<main class="ownercontent">${({dashboard:dashboard,bookings:bookingsPage,services:servicesPage,team:teamPage,branches:branchesPage,settings:settingsPage})[section]()}</main></div><nav class="ownerbottom" aria-label="ადმინისტრაციის ნავიგაცია">${navButtons(true)}<button data-act="nav" data-id="settings" class="${section==='settings'?'active':''}"><span class="sym">⚙</span>სხვა</button></nav>`)}
function openModal(html){document.getElementById('modalhost')?.remove();let div=document.createElement('div');div.id='modalhost';div.innerHTML=`<div class="modalveil"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;document.body.appendChild(div);div.querySelector('.modalveil').addEventListener('click',ev=>{if(ev.target.classList.contains('modalveil'))closeModal()});}
function closeModal(){document.getElementById('modalhost')?.remove()}
function serviceModal(id){let s=id==='new'?{id:'',name:'',category:'nails',price:50,duration:60,active:true}:service(id);if(!s)return;openModal(`<div class="between"><div><div class="eyebrow">MANAGE SERVICE</div><h2 style="margin-top:7px">${id==='new'?'მომსახურების დამატება':'მომსახურების რედაქტირება'}</h2></div><button class="iconbtn" data-act="close">✕</button></div><form id="serviceForm" class="stack" style="margin-top:23px"><input name="id" type="hidden" value="${e(s.id)}"><div class="field"><label>დასახელება *</label><input name="name" required maxlength="90" value="${e(s.name)}"></div><div class="field"><label>კატეგორია</label><select name="category">${CATS.map(c=>`<option value="${c.id}" ${s.category===c.id?'selected':''}>${e(c.name)}</option>`).join('')}</select></div><div class="flex gap12"><div class="field grow"><label>ფასი (₾)</label><input type="number" name="price" min="0" max="10000" required value="${s.price}"></div><div class="field grow"><label>ხანგრძლივობა (წთ)</label><select name="duration">${[30,45,60,75,90,120,150,180].map(t=>`<option value="${t}" ${s.duration===t?'selected':''}>${t}</option>`).join('')}</select></div></div><label class="flex gap8 medium" style="align-items:center"><input type="checkbox" name="active" ${s.active?'checked':''}> აქტიური (ხელმისაწვდომი კლიენტისთვის)</label><div class="modalfoot"><button class="btn outline" type="button" data-act="close">დახურვა</button><button class="btn" type="submit">შენახვა</button></div></form>`)}
function staffModal(id){let w=id==='new'?{id:'',name:'',branch:'mirian',skills:['nails'],active:true}:worker(id);if(!w)return;openModal(`<div class="between"><div><div class="eyebrow">TEAM MEMBER</div><h2 style="margin-top:7px">${id==='new'?'სპეციალისტის დამატება':'სპეციალისტის რედაქტირება'}</h2></div><button class="iconbtn" data-act="close">✕</button></div><form id="staffForm" class="stack" style="margin-top:23px"><input name="id" type="hidden" value="${e(w.id)}"><div class="field"><label>სახელი და გვარი *</label><input name="name" required maxlength="80" value="${e(w.name)}"></div><div class="field"><label>ფილიალი</label><select name="branch">${db.branches.map(b=>`<option value="${b.id}" ${w.branch===b.id?'selected':''}>${e(b.name)}</option>`).join('')}</select></div><div class="field"><label>მომსახურების კატეგორიები</label><div class="pillwrap">${CATS.map(c=>`<label class="pill" style="cursor:pointer"><input type="checkbox" name="skill" value="${c.id}" ${w.skills.includes(c.id)?'checked':''}> ${c.icon} ${e(c.name)}</label>`).join('')}</div></div><label class="flex gap8 medium" style="align-items:center"><input name="active" type="checkbox" ${w.active?'checked':''}> აქტიური სპეციალისტი</label><div class="modalfoot"><button class="btn outline" type="button" data-act="close">დახურვა</button><button class="btn">შენახვა</button></div></form>`)}
function bookingModal(){openModal(`<div class="between"><div><div class="eyebrow">NEW APPOINTMENT</div><h2 style="margin-top:7px">ჯავშნის დამატება</h2></div><button class="iconbtn" data-act="close">✕</button></div><form id="manualBookingForm" class="stack" style="margin-top:20px"><div class="flex gap12"><div class="field grow"><label>კლიენტის სახელი *</label><input required name="name" placeholder="დემო კლიენტი" minlength="2"></div><div class="field grow"><label>ტელეფონი (დემო)</label><input name="phone" placeholder="555 00 00 00"></div></div><div class="field"><label>ფილიალი</label><select name="branchId" id="manualBranch">${db.branches.map(b=>`<option value="${b.id}">${e(b.name)}</option>`).join('')}</select></div><div class="field"><label>მომსახურება</label><select name="serviceId" id="manualService">${db.services.filter(s=>s.active).map(s=>`<option value="${s.id}">${e(s.name)} · ${prettyPrice(s.price)}</option>`).join('')}</select></div><div class="flex gap12"><div class="field grow"><label>თარიღი</label><input type="date" required name="date" min="${today()}" value="${tomorrow()}"></div><div class="field grow"><label>დრო</label><select name="time">${Array.from({length:20},(_,i)=>fmtMinute(600+i*30)).map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div></div><p class="muted tiny">სისტემა შეარჩევს ამ ფილიალის თავისუფალ შესაბამის სპეციალისტს.</p><div class="modalfoot"><button type="button" class="btn outline" data-act="close">დახურვა</button><button class="btn" type="submit">დამატება</button></div></form>`)}
function detailsModal(id){let b=byId(db.bookings,id);if(!b)return;openModal(`<div class="between"><div><div class="eyebrow">APPOINTMENT DETAILS</div><h2 style="margin-top:7px">${e(b.id)}</h2></div><button class="iconbtn" data-act="close">✕</button></div><div class="stack" style="margin-top:22px">${[['კლიენტი',b.name],['ნომერი',b.phone||'ჯავშნის ჩანაწერი'],['მომსახურება',service(b.serviceId)?.name||'—'],['სპეციალისტი',worker(b.staffId)?.name||'—'],['ფილიალი',branch(b.branchId)?.name||'—'],['დრო',`${dateDisplay(b.date)} ${b.time}`],['სტატუსი',STATUS[b.status]||b.status],['კომენტარი',b.note||'—']].map(([k,v])=>`<div class="between" style="border-bottom:1px solid var(--line);padding-bottom:12px;font-size:12px"><span class="muted">${k}</span><strong style="text-align:right">${e(v)}</strong></div>`).join('')}</div><div class="modalfoot"><button class="btn outline" data-act="close">დახურვა</button></div>`)}
function exportDB(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='DMS-demo-data.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('JSON ფაილი შეიქმნა')}
document.addEventListener('click',ev=>{let btn=ev.target.closest('[data-act]');if(!btn)return;let act=btn.dataset.act,id=btn.dataset.id;if(act==='logout'&&SERVER_MODE){requestJSON('/api/logout',{method:'POST'}).then(()=>loginScreen());return}if(act==='nav'){navTo(id);return}if(act==='close'){closeModal();return}if(act==='newbooking'){bookingModal();return}if(act==='editservice'){serviceModal(id);return}if(act==='editstaff'){staffModal(id);return}if(act==='details'){detailsModal(id);return}if(act==='clearfilters'){filterBranch='all';filterStatus='all';filterDate='';filterSearch='';render();return}if(act==='status'){let bk=byId(db.bookings,id);if(!bk)return;if(btn.dataset.status==='cancelled'&&!confirm('გსურს ამ ჯავშნის გაუქმება?'))return;bk.status=btn.dataset.status;saveDB(db);toast('სტატუსი განახლებულია');render();return}if(act==='export'){exportDB();return}if(act==='import'){if(SERVER_MODE){toast('ონლაინ რეჟიმში იმპორტი გამორთულია');return}document.getElementById('importfile')?.click();return}if(act==='reset'){if(SERVER_MODE){toast('ონლაინ რეჟიმში განულება გამორთულია');return}if(confirm('წაიშალოს საცდელი ცვლილებები და აღდგეს საწყისი მონაცემები?')){saveDB(initialDB());toast('საწყისი მონაცემები აღდგენილია');render()}return}});
document.addEventListener('change',ev=>{let el=ev.target;if(el.id==='filterBranch'){filterBranch=el.value;render()}if(el.id==='filterStatus'){filterStatus=el.value;render()}if(el.id==='filterDate'){filterDate=el.value;render()}if(el.id==='filterSearch'){filterSearch=el.value;render()}if(el.id==='importfile'){if(SERVER_MODE)return;let f=el.files?.[0];if(!f)return;f.text().then(raw=>{try{let o=JSON.parse(raw);if(o.version!==4||!Array.isArray(o.bookings)||!Array.isArray(o.services)||!Array.isArray(o.staff))throw Error('invalid');if(!confirm('ჩავანაცვლოთ არსებული სატესტო მონაცემები იმპორტირებული ფაილით?'))return;saveDB(o);toast('საცდელი მონაცემები იმპორტირებულია');render()}catch(err){toast('ფაილის ფორმატი არასწორია')}})}});
document.addEventListener('input',ev=>{if(ev.target.id==='filterSearch'){filterSearch=ev.target.value;let pos=ev.target.selectionStart;render();let inp=document.getElementById('filterSearch');inp?.focus();inp?.setSelectionRange(pos,pos)}});
document.addEventListener('submit',ev=>{let form=ev.target;if(!['serviceForm','staffForm','manualBookingForm'].includes(form.getAttribute('id')))return;ev.preventDefault();let f=new FormData(form);if(form.getAttribute('id')==='serviceForm'){let id=String(f.get('id')||''),val={id:id||'svc'+Date.now().toString(36),name:String(f.get('name')||'').trim(),category:String(f.get('category')),price:Number(f.get('price')),duration:Number(f.get('duration')),active:f.has('active')};if(!val.name||!Number.isFinite(val.price)||val.price<0||val.price>10000){toast('მონაცემები არასწორია');return}if(id){Object.assign(service(id),val)}else db.services.push(val);saveDB(db);closeModal();render();toast('მომსახურება შენახულია');return}if(form.getAttribute('id')==='staffForm'){let id=String(f.get('id')||''),skills=f.getAll('skill').map(String),val={id:id||'st'+Date.now().toString(36),name:String(f.get('name')||'').trim(),branch:String(f.get('branch')),skills,active:f.has('active')};if(!val.name||!skills.length){toast('შეავსე სახელი და აირჩიე კატეგორია');return}if(id){Object.assign(worker(id),val)}else db.staff.push(val);saveDB(db);closeModal();render();toast('სპეციალისტი შენახულია');return}if(form.getAttribute('id')==='manualBookingForm'){let branchId=String(f.get('branchId')),serviceId=String(f.get('serviceId')),date=String(f.get('date')),time=String(f.get('time')),s=service(serviceId),free=s?availableStaff(branchId,s.category,date,time,s.duration):[],name=String(f.get('name')||'').trim();if(!name||!free.length){toast('შეამოწმე მონაცემები — შეიძლება დრო დაკავებული იყოს');return}db.bookings.push({id:'DM'+Date.now().toString(36).toUpperCase(),branchId,serviceId,staffId:free[0].id,date,time,status:'confirmed',name,phone:String(f.get('phone')||'').trim(),createdAt:new Date().toISOString(),demo:true});saveDB(db);closeModal();navTo('bookings');toast('ჯავშანი დაემატა');return}});
initialize();

document.addEventListener('submit',async ev=>{if(ev.target.id!=='serverLogin')return;ev.preventDefault();let pass=String(new FormData(ev.target).get('password')||'');try{await requestJSON('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass})});await loadServerState(true)}catch(err){loginScreen(err.message)}});
</script></body></html>
